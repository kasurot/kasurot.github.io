---
layout: default
title: Executive Briefs | Kevin Armstrong
---
<section>
    <h2 class="section-title">Executive Briefs &amp; Insights</h2>
    <div class="posts-list">
        {% assign briefs = site.briefs | sort: 'date' %}
        {% for brief in briefs reversed %}
          <div class="post-item">
              <h3><a href="{{ brief.url | relative_url }}">{{ brief.title }}</a></h3>
              <p class="post-meta">Published on {{ brief.date | date: "%B %-d, %Y" }}</p>
              <p>{{ brief.description }}</p>
          </div>
        {% endfor %}
    </div>
</section>

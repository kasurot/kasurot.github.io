<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com/">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230f172a%22/><text x=%2250%22 y=%2250%22 font-family=%22Arial%22 font-size=%2250%22 fill=%22white%22 text-anchor=%22middle%22 dy=%22.35em%22>KA</text></svg>">

    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">

    <style>
        :root {
            --header-blue: #0f172a;
            --text-dark: #1e293b;
            --text-gray: #475569;
            --bg-color: #f8fafc;
            --accent-gold: #b45309;
            --container-bg: #ffffff;
            --border-light: #e2e8f0;
            --border-medium: #cbd5e1;
            --text-body: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --header-blue: #e2e8f0;
                --text-dark: #f1f5f9;
                --text-gray: #94a3b8;
                --bg-color: #0f172a;
                --accent-gold: #fbbf24;
                --container-bg: #1e293b;
                --border-light: #334155;
                --border-medium: #475569;
                --text-body: #cbd5e1;
            }
        }

        /* Manual Theme Overrides */
        body.light-mode {
            --header-blue: #0f172a;
            --text-dark: #1e293b;
            --text-gray: #475569;
            --bg-color: #f8fafc;
            --accent-gold: #b45309;
            --container-bg: #ffffff;
            --border-light: #e2e8f0;
            --border-medium: #cbd5e1;
            --text-body: #334155;
        }

        body.dark-mode {
            --header-blue: #e2e8f0;
            --text-dark: #f1f5f9;
            --text-gray: #94a3b8;
            --bg-color: #0f172a;
            --accent-gold: #fbbf24;
            --container-bg: #1e293b;
            --border-light: #334155;
            --border-medium: #475569;
            --text-body: #cbd5e1;
        }

        body {
            font-family: 'Book Antiqua', Palatino, 'Palatino Linotype', 'Palatino LT STD', Georgia, serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            line-height: 1.6;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* Navigation Styles */
        .main-nav {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
        }
        .main-nav a {
            text-decoration: none;
            color: var(--text-gray);
            font-weight: 600;
            font-size: 13px;
            padding: 5px 0;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
        }
        .main-nav a:hover {
            color: var(--header-blue);
        }
        .main-nav a.active {
            color: var(--header-blue);
            border-bottom-color: var(--accent-gold);
        }

        /* Post Listing Styles */
        .posts-list .post-item {
            margin-bottom: 20px;
            padding: 20px;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            background-color: var(--bg-color);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }
        
        /* Card Hover Effect */
        .posts-list .post-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border-color: var(--accent-gold);
        }

        /* Dark mode specific card adjustment */
        body.dark-mode .posts-list .post-item {
            background-color: rgba(255, 255, 255, 0.03);
        }

        .posts-list .post-item:last-child { border-bottom: 1px solid var(--border-light); }
        
        .posts-list h3 { margin-bottom: 5px; }
        .posts-list h3 a { color: var(--header-blue); text-decoration: none; font-size: 18px; }
        .posts-list h3 a:hover { text-decoration: underline; }
        .posts-list .post-meta { font-size: 12px; color: var(--text-gray); font-style: italic; margin-bottom: 10px; }

        /* Single Post Layout Styles */
        .post-header { margin-bottom: 30px; }
        .post-header h1 { 
            text-transform: none; 
            letter-spacing: 0; 
            border-bottom: 1px solid var(--border-medium); 
            padding-bottom: 15px; 
            margin-bottom: 10px;
            font-size: 1.75rem; /* ~35px */
            line-height: 1.3;
            font-weight: 700;
        }
        .post-header .meta { font-size: 13px; color: var(--text-gray); font-style: italic; }

        /* Post Content Styles */
        .post-content {
            font-size: 1.5rem; /* ~19px */
            line-height: 1.65;
            color: var(--text-dark);
            /* max-width: 65ch; /* Limits line length for readability */
            margin-left: auto;
            margin-right: auto;
        }
        
        /* Automatic Lead Paragraph Styling */
        .post-content > p:first-of-type {
            font-size: 1.05em;
            line-height: 1.6;
            color: var(--header-blue);
            margin-bottom: 2rem;
            font-weight: 500;
        }

        .post-content p { 
            margin-bottom: 1.5rem; 
        }
        .post-content h2 { 
            font-size: 1.75rem; /* ~28px */
            color: var(--header-blue); 
            margin-top: 3rem; 
            margin-bottom: 1rem;
            font-weight: 700;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 8px;
        }
        .post-content h3 {
            font-size: 1.4rem; /* ~22px */
            color: var(--text-dark);
            margin-top: 2rem;
            margin-bottom: 0.75rem;
            font-weight: 600;
        }
        .post-content ul, .post-content ol { 
            margin-bottom: 1.5rem; 
            margin-left: 20px;
            list-style-type: disc;
        }
        .post-content li { 
            margin-bottom: 0.5rem; 
            padding-left: 0.5rem;
        }
        .post-content blockquote {
            border-left: 4px solid var(--accent-gold);
            padding: 15px 20px;
            margin: 30px 0;
            background-color: rgba(0,0,0,0.03);
            font-style: italic;
            color: var(--text-gray);
            border-radius: 0 8px 8px 0;
        }
        .post-content strong {
            color: var(--header-blue);
        }

        .resume-container {
            max-width: 8.5in;
            margin: 40px auto;
            background: var(--container-bg);
            padding: 40px 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            min-height: 11in;
        }

        header {
            border-bottom: 2px solid var(--border-light);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--header-blue);
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
        }

        h2 {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .contact-info {
            font-size: 13px;
            color: var(--text-gray);
            display: flex;
            gap: 15px;
        }

        /* SVG Icon Styling */
        .icon {
            width: 16px;
            height: 16px;
            vertical-align: text-bottom;
            fill: currentColor;
            margin-right: 4px;
        }

        .contact-info a {
            color: var(--header-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .section-title {
            color: var(--header-blue);
            font-size: 14px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-medium);
            padding-bottom: 4px;
            margin-top: 20px;
            margin-bottom: 12px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        /* Collapsible Section Styling */
        details > summary { list-style: none; cursor: pointer; position: relative; }
        details > summary::-webkit-details-marker { display: none; } /* Hide default triangle */
        details > summary::after {
            content: '+'; position: absolute; right: 0; top: 0;
            font-size: 16px; color: var(--header-blue);
        }
        details[open] > summary::after { content: '−'; } /* Minus sign */
        /* Smooth fade in for content */
        details[open] > div { animation: fadeIn 0.3s ease-in-out; }

        p { margin-bottom: 8px; font-size: 13px; color: var(--text-body); }
        ul { list-style-position: outside; margin-left: 18px; margin-bottom: 10px; }
        li { margin-bottom: 6px; font-size: 13px; color: var(--text-body); }

        .competency-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .competency-grid { grid-template-columns: 1fr; }
            .resume-container { padding: 20px; }
            .contact-info { flex-direction: column; gap: 5px; }
            .separator { display: none; }
        }

        .competency-column h3 {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--accent-gold);
            margin-bottom: 5px;
            font-weight: 700;
        }

        .cert-list { list-style: none; margin-left: 0; font-size: 13px; }
        .cert-list li { margin-bottom: 4px; }
        .cert-category { font-weight: 700; color: var(--header-blue); margin-right: 5px; }
        .pending-cert { color: var(--text-gray); font-style: italic; font-size: 12px; }

        .job-block, .card-block {
            margin-bottom: 20px;
            padding: 20px;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            background-color: var(--bg-color);
            transition: all 0.2s ease;
        }
        .job-block:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border-color: var(--accent-gold);
        }
        .job-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2px; }
        .job-title { font-weight: 700; font-size: 14px; color: var(--header-blue); }
        .company-name { font-weight: 600; color: var(--text-dark); }
        .job-details { font-size: 12px; color: var(--text-gray); font-style: italic; }
        .early-career { font-size: 12px; color: var(--text-gray); margin-top: 5px; border-top: 1px dashed var(--border-light); padding-top: 5px; }
        .education-focus { font-size: 12px; color: var(--text-gray); }

        .download-btn {
            position: fixed; bottom: 20px; right: 20px;
            background-color: var(--header-blue); color: var(--bg-color);
            padding: 12px 24px; border-radius: 50px;
            text-decoration: none; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            font-weight: bold; cursor: pointer; border: none; font-family: inherit;
        }

        .theme-toggle {
            position: fixed; bottom: 80px; right: 20px;
            background-color: var(--header-blue); color: var(--bg-color);
            width: 50px; height: 50px; border-radius: 50%;
            border: none; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            display: flex; align-items: center; justify-content: center;
            z-index: 100; transition: transform 0.2s;
        }
        .theme-toggle:hover { transform: scale(1.1); }

        .resume-footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border-light);
            text-align: center;
            font-size: 11px;
            color: var(--text-gray);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media print {
            .resume-container { box-shadow: none; margin: 0; padding: 0; width: 100%; max-width: none; }
            .download-btn, .theme-toggle { display: none; }
            a { text-decoration: none; color: inherit; }
            /* Force expand all details for print */
            details { display: block; }
            summary { display: none; }
            div { animation: none !important; }
        }
    </style>
</head>
<body>

    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">
        <!-- SVG Sun/Moon Icon -->
        <svg class="icon" style="width: 24px; height: 24px; margin: 0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>
    <button class="download-btn" onclick="window.print()">Print / Save PDF</button>

    <div class="resume-container">
        {% include header.html %}

        <main>
            {{ content }}
        </main>

        {% include footer.html %}
    </div>

    <script>
        const toggleBtn = document.getElementById('theme-toggle');
        const body = document.body;

        // Load saved theme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            body.classList.add(savedTheme);
        }

        toggleBtn.addEventListener('click', () => {
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDarkMode = body.classList.contains('dark-mode') || (!body.classList.contains('light-mode') && systemDark);

            body.classList.remove('light-mode', 'dark-mode');
            const newTheme = isDarkMode ? 'light-mode' : 'dark-mode';
            body.classList.add(newTheme);
            localStorage.setItem('theme', newTheme);
        });

        // Set current year in footer
        document.getElementById('year').textContent = new Date().getFullYear();

        // Ensure all details are open when printing
        window.onbeforeprint = () => {
            document.querySelectorAll('details').forEach(d => d.setAttribute('open', ''));
        };
    </script>
</body>
</html>

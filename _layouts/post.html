---
layout: default
---
<article class="post">
  <h1 style="text-transform: none; letter-spacing: 0; border-bottom: 1px solid var(--border-medium); padding-bottom: 10px;">{{ page.title }}</h1>
  <p style="font-size: 13px; color: var(--text-gray); margin-bottom: 20px;"><em>Published on {{ page.date | date: "%B %-d, %Y" }}</em></p>

  <div class="post-content">
    {{ content }}
  </div>
</article>

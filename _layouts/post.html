---
layout: default
---
<style>
  .post-hero { margin: 0 0 2rem 0; }
  .post-hero img { width: 100%; height: auto; display: block; border-radius: 4px; }
  .post-hero figcaption { margin-top: .6rem; font-size: .85rem; color: var(--text-gray); font-style: italic; }
</style>
<article class="post">
  <div class="post-nav">
    <a href="{{ '/briefs.html' | relative_url }}">&larr; Back to Executive Briefs</a>
  </div>
  <div class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="meta">Published on {{ page.date | date: "%B %-d, %Y" }}</p>
  </div>

  {% if page.image %}
  <figure class="post-hero">
    <img src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title | escape }}" loading="lazy">
    {% if page.image_caption %}<figcaption>{{ page.image_caption }}</figcaption>{% endif %}
  </figure>
  {% endif %}

  <div class="post-content">
    {{ content }}
  </div>

  <div class="post-nav post-nav-bottom">
    <a href="{{ '/briefs.html' | relative_url }}">&larr; Back to Executive Briefs</a>
  </div>
</article>

---
layout: default
---
<style>
  /* Executive brief hero: reduced band. Atmosphere gets a band; evidence gets the page. */
  .post-hero { margin: 0 0 2rem; }
  .post-hero img {
    display: block;
    width: 100%;
    height: auto;             /* let aspect-ratio own the height, not the height="" attribute */
    aspect-ratio: 5 / 2;
    max-height: 290px;
    object-fit: cover;
    object-position: 50% 45%;
    border-radius: 4px;
    background: var(--border-light);
  }
  .post-hero figcaption { margin-top: .6rem; font-size: .85rem; color: var(--text-gray); font-style: italic; }
  @media (prefers-color-scheme: dark) { body:not(.light-mode) .post-hero img { outline: 1px solid rgba(226,232,240,.12); outline-offset: -1px; } }
  @media (max-width: 768px) { .post-hero img { aspect-ratio: 2 / 1; max-height: 200px; } }
  @media print { .post-hero img { aspect-ratio: auto; height: 2.2in; } }
</style>
<article class="post">
  <div class="post-nav">
    <a href="{{ '/briefs.html' | relative_url }}">&larr; Back to Executive Briefs</a>
  </div>
  <div class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="meta">Published on {{ page.date | date: "%B %-d, %Y" }}</p>
  </div>

  {% if page.image %}
  <figure class="post-hero">
    <img src="{{ page.image | relative_url }}"{% if page.image_width %} width="{{ page.image_width }}" height="{{ page.image_height }}"{% endif %} loading="eager" fetchpriority="high" decoding="async" alt="{{ page.image_alt | escape }}">
    {% if page.image_caption %}<figcaption>{{ page.image_caption }}</figcaption>{% endif %}
  </figure>
  {% endif %}

  <div class="post-content">
    {{ content }}
  </div>

  <div class="post-nav post-nav-bottom">
    <a href="{{ '/briefs.html' | relative_url }}">&larr; Back to Executive Briefs</a>
  </div>
</article>

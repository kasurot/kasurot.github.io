<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 770" width="560" height="770" role="img" aria-labelledby="t d">
<title id="t">A limit that exists is not a limit that binds</title>
<desc id="d">Three ways a payment limit fails, the single cause they share, and the four things that make a limit bind.</desc>

<style>
  .bg   { fill:#ffffff; }
  .h1   { font-family:'Book Antiqua',Palatino,'Palatino Linotype',Georgia,serif; font-size:37px; fill:#0f172a; font-weight:700; }
  .lab  { font-family:'Book Antiqua',Palatino,'Palatino Linotype',Georgia,serif; font-size:27px; fill:#1e293b; font-weight:700; }
  .num  { font-family:'Book Antiqua',Palatino,Georgia,serif; font-size:27px; fill:#b45309; font-weight:700; }
  .item { font-family:'Book Antiqua',Palatino,'Palatino Linotype',Georgia,serif; font-size:27px; fill:#1e293b; font-weight:700; }
  .band { font-family:'Book Antiqua',Palatino,'Palatino Linotype',Georgia,serif; font-size:28px; fill:#f1f5f9; font-weight:700; }
  .card { fill:#ffffff; stroke:#e2e8f0; stroke-width:1.8; }
</style>

<rect class="bg" x="0" y="0" width="560" height="770"/>

<text class="h1" x="30" y="58">A limit that exists</text>
<text class="h1" x="30" y="100">is not a limit that binds</text>

<line x1="30" y1="128" x2="530" y2="128" stroke="#e2e8f0" stroke-width="1.8"/>

<text class="lab" x="30" y="168">Three ways it fails</text>

<rect class="card" x="30" y="186" width="500" height="58" rx="5"/>
<text class="num"  x="50" y="224">1</text>
<text class="item" x="84" y="224">Set above the loss</text>

<rect class="card" x="30" y="254" width="500" height="58" rx="5"/>
<text class="num"  x="50" y="292">2</text>
<text class="item" x="84" y="292">Policy, not the engine</text>

<rect class="card" x="30" y="322" width="500" height="58" rx="5"/>
<text class="num"  x="50" y="360">3</text>
<text class="item" x="84" y="360">Attached to the wrong object</text>

<path d="M280 388 L280 414" stroke="#b45309" stroke-width="2.5"/>
<path d="M270 406 L280 418 L290 406" fill="none" stroke="#b45309" stroke-width="2.5"/>

<rect x="30" y="428" width="500" height="88" rx="5" fill="#0f172a"/>
<rect x="30" y="428" width="5" height="88" fill="#b45309"/>
<text class="band" x="56" y="470">Same failure, different clothes.</text>
<text class="band" x="56" y="504">Nobody owned the number.</text>

<text class="lab" x="30" y="568">What makes it bind</text>

<rect x="30" y="586" width="4" height="34" fill="#b45309"/>
<text class="item" x="54" y="613">Engine, not policy</text>

<rect x="30" y="634" width="4" height="34" fill="#b45309"/>
<text class="item" x="54" y="661">Period total</text>

<rect x="30" y="682" width="4" height="34" fill="#b45309"/>
<text class="item" x="54" y="709">Approval stays real</text>

<rect x="30" y="730" width="4" height="34" fill="#b45309"/>
<text class="item" x="54" y="757">Revocation tested live</text>
</svg>
